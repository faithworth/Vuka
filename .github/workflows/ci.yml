name: CI

on:
  push:
    branches: [main, production/global-payout-currency-seo]
  pull_request:
    branches: [main, production/global-payout-currency-seo]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- run

      - name: Audit (non-blocking)
        run: npm audit --audit-level=critical || true



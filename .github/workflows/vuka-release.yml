name: Vuka Music Release\n\non:\n  push:\n    branches: [main]\n    paths:\n      - "apps/desktop/**"\n      - "apps/mobile/**"\n      - ".github/workflows/vuka-release.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\njobs:\n  desktop:\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - os: windows-latest\n            target: win\n            extension: exe\n            asset: Vuka-Music-Windows.exe\n          - os: macos-latest\n            target: mac\n            extension: dmg\n            asset: Vuka-Music-macOS.dmg\n    runs-on: ${{ matrix.os }}\n    defaults:\n      run:\n        working-directory: apps/desktop\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-node@v6\n        with:\n          node-version: 24\n          cache: npm\n          cache-dependency-path: apps/desktop/package.json\n      - name: Install dependencies\n        run: npm install\n      - name: Build installer\n        shell: bash\n        run: |\n          if [ "${{ matrix.target }}" = "win" ]; then\n            npx electron-builder --win nsis --publish never\n          else\n            npx electron-builder --mac dmg --universal --publish never\n          fi\n      - name: Prepare release asset\n        shell: bash\n        run: |\n          mkdir -p ../../release-assets\n          cp dist/*.${{ matrix.extension }} ../../release-assets/${{ matrix.asset }}\n      - uses: actions/upload-artifact@v7\n        with:\n          name: release-${{ matrix.target }}\n          path: release-assets/${{ matrix.asset }}\n          if-no-files-found: error\n          retention-days: 7\n\n  android:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: apps/mobile\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-node@v6\n        with:\n          node-version: 22\n          cache: npm\n          cache-dependency-path: apps/mobile/package.json\n      - uses: actions/setup-java@v6\n        with:\n          distribution: temurin\n          java-version: "17"\n      - uses: android-actions/setup-android@v4\n        with:\n          packages: "platform-tools"\n      - name: Install dependencies\n        run: npm install\n      - name: Generate native Android project\n        run: npx expo prebuild --platform android --non-interactive\n      - name: Build APK\n        run: cd android && ./gradlew --no-daemon assembleDebug\n      - name: Prepare release asset\n        run: |\n          mkdir -p ../../release-assets\n          cp android/app/build/outputs/apk/debug/app-debug.apk ../../release-assets/Vuka-Music-Android.apk\n      - uses: actions/upload-artifact@v7\n        with:\n          name: release-android\n          path: release-assets/Vuka-Music-Android.apk\n          if-no-files-found: error\n          retention-days: 7\n\n  release:\n    needs: [desktop, android]\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/download-artifact@v7\n        with:\n          pattern: release-*\n          path: release-assets\n          merge-multiple: true\n      - name: Create GitHub release\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          VERSION="1.0.1"\n          TAG="v${VERSION}"\n          if gh release view "\${TAG}" >/dev/null 2>&1; then gh release delete "\${TAG}" --yes; fi\n          gh release create "${TAG}" release-assets/* --title "Vuka Music ${VERSION}" --notes "Vuka Music desktop and Android builds for ${VERSION}. Windows and macOS are currently unsigned; Android is a test APK. iPhone/iPad physical-device distribution will follow Apple signing/TestFlight preparation."
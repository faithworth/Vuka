name: Code Review

on:
  pull_request:
    branches: [main]

jobs:
  risk-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Classify risk
        id: risk
        run: node scripts/classify-pr-risk.js ${{ steps.changed.outputs.files }}

      - name: Comment risk tier on PR
        uses: actions/github-script@v7
        with:
          script: |
            const risk = '${{ steps.risk.outputs.risk }}';
            const emoji = risk === 'HIGH' ? '🔴' : risk === 'MEDIUM' ? '🟡' : '🟢';
            const note = risk === 'HIGH'
              ? 'Touches payments, auth, verification, or the DB schema. **Human review required before merge.**'
              : risk === 'MEDIUM'
              ? 'Touches API routes or shared lib code. A quick skim is recommended.'
              : 'Docs, tests, or styling only. Safe to fast-track.';
            const body = `### ${emoji} Automated risk check: **${risk}**\n\n${note}\n\n_This is an automated classification, not a substitute for actually reading the diff on HIGH-risk changes._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Automated risk check'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
